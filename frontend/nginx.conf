# Local/Compose serving. Mirrors production routing: /api/* is proxied to the API so
# the browser sees one origin (in production the Vercel rewrite does this).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_buffering off;          # SSE (Phase 4)
        proxy_read_timeout 1h;
    }

    # Hashed build assets never change; cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback; index.html itself must always be revalidated.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
