[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "incident-desk-api"
version = "0.1.0"
description = "Tasky API - team task management with AI assistance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.14,<2.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "sentry-sdk[fastapi]>=2.19,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pyjwt>=2.10,<3.0",
    "email-validator>=2.2,<3.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "aiosmtpd>=1.4,<2.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.7,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "ASYNC",    # async pitfalls
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ (migrations dir) would otherwise make the alembic package look local
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and literal test secrets are fine in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "db: needs a reachable PostgreSQL (DATABASE_URL)",
    "slow: excluded from the fast local loop (-m 'not slow')",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async runs ORM code in greenlets; without this those lines look uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
