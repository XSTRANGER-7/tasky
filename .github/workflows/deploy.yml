# Release: push a tag v* -> build the API image in CI (never on the 1 GB instance), push it
# to GHCR, then pull and restart on EC2 over SSH and verify /health. Vercel deploys the
# frontend itself from main.
#
# Required repository secrets: EC2_HOST, EC2_SSH_KEY (deploy-only key), API_DOMAIN.
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to (re)deploy, e.g. v0.1.0"
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner (GHCR requires it)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push'

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: ./backend
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/incident-desk-api:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/incident-desk-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          TAG: ${{ env.TAG }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG
          script_stop: true
          script: |
            cd ~/incident-desk
            export TAG
            docker compose -f docker-compose.prod.yml pull api worker
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            for i in $(seq 1 30); do
              docker compose -f docker-compose.prod.yml exec -T api curl -fsS localhost:8000/health && break
              sleep 3
            done
            docker compose -f docker-compose.prod.yml exec -T api curl -fsS localhost:8000/health
            docker image prune -f

      - name: Public health check through Caddy
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://${{ secrets.API_DOMAIN }}/health" && exit 0
            sleep 5
          done
          echo "public /health failed" >&2
          exit 1
