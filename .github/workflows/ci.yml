name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/test
      JWT_SECRET: test-secret-test-secret-test-secret-00
      APP_ENV: test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy app
      - name: migrations apply cleanly (up, down, up)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: models and migrations agree (no autogenerate drift)
        run: alembic check
      - name: committed OpenAPI schema matches the API
        run: |
          python -m app.scripts.export_openapi ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json || {
            echo "::error::frontend/openapi.json is stale. Run: make gen-client"; exit 1; }
      - name: pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: triage eval (rule engine; the number reported in the README)
        run: python -m evals.triage_eval | tee -a "$GITHUB_STEP_SUMMARY"
      - name: pip-audit
        run: pip-audit --skip-editable

  frontend:
    name: frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: generated API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale. Run: make gen-client"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  security:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1

  compose-smoke:
    name: docker compose smoke
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: GIT_SHA=${GITHUB_SHA::7} docker compose up -d --build
      - run: bash scripts/wait-for-health.sh http://localhost:8000/health 180
      - name: web serves the SPA and proxies /api
        run: |
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          curl -fsS http://localhost:5173/api/v1/health | grep -q '"db":"ok"'
      - name: worker is running
        run: test "$(docker compose ps worker --format '{{.State}}')" = running
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
